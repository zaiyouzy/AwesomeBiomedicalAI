name: Biweekly biomedical image paper discovery

on:
  # Check every Monday at 13:17 UTC. The cadence job allows a scan every
  # other week, anchored to 2026-10-12; off weeks never call discovery or AI.
  schedule:
    - cron: "17 13 * * 1"

  # Also allow a maintainer to run and demonstrate the workflow on demand.
  workflow_dispatch:
    inputs:
      source:
        description: Discovery source
        required: true
        default: all
        type: choice
        options:
          - pubmed
          - openalex
          - all
      queue_limit:
        description: Maximum number of new high/medium candidates in the review queue
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
          - "25"
          - "50"

# Discovery and AI screening are read-only: they cannot change the repository.
permissions:
  contents: read

concurrency:
  group: biomedical-image-discovery
  cancel-in-progress: false

jobs:
  cadence:
    # Fork-only safety guard. If this file is copied upstream, nothing runs.
    if: github.repository == 'zaiyouzy/AwesomeBiomedicalAI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.cadence.outputs.run }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check the biweekly schedule
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_ANCHOR: "2026-10-12"
        run: >-
          python3 .agents/skills/biomedical-image-curator/scripts/schedule.py
          --event "$EVENT_NAME"
          --anchor "$SCHEDULE_ANCHOR"
          >> "$GITHUB_OUTPUT"

      - name: Show the schedule decision
        env:
          SCHEDULE_REASON: ${{ steps.cadence.outputs.reason }}
        run: echo "$SCHEDULE_REASON" >> "$GITHUB_STEP_SUMMARY"

  discover:
    needs: cadence
    if: needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test the curator helper
        run: >-
          python -m unittest discover
          -s .agents/skills/biomedical-image-curator/tests
          -p "test_*.py"
          -v

      - name: Discover candidate papers (v2)
        env:
          DISCOVERY_SOURCE: ${{ inputs.source || 'all' }}
          QUEUE_LIMIT: ${{ inputs.queue_limit || '10' }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          mkdir -p .curator
          python .agents/skills/biomedical-image-curator/scripts/curator.py \
            --repo . \
            discover-v2 \
            --source "$DISCOVERY_SOURCE" \
            --queue-limit "$QUEUE_LIMIT" \
            --prefix .curator/weekly

      - name: AI first-pass review (optional, read-only, hard-capped)
        if: success()
        env:
          # Store the key in the fork's Actions secrets. The job records token
          # usage and an estimated cost and never writes the key anywhere.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python .agents/skills/biomedical-image-curator/scripts/curator.py \
            --repo . \
            ai-review \
            --queue .curator/weekly-review-queue.json \
            --prefix .curator/weekly

      - name: Show the report in the run summary
        if: success()
        run: |
          {
            echo "## Biomedical Images — Other — deterministic discovery v2";
            echo "";
            cat .curator/weekly-summary.md;
            echo "";
            if [ -f .curator/weekly-ai-review.md ]; then cat .curator/weekly-ai-review.md; echo ""; fi;
            echo "**How to act on the queue:** download the biomedical-image-candidates artifact (30-day retention), open weekly-review-queue.md, verify each entry against the skill policy, and record your decisions in reviewed-papers.json (accepted/excluded/other_page) in a normal human-reviewed pull request. The workflow never edits the catalogue.";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: biomedical-image-candidates-${{ github.run_number }}
          path: |
            .curator/weekly-review-queue.json
            .curator/weekly-review-queue.md
            .curator/weekly-raw-audit.json
            .curator/weekly-summary.md
            .curator/weekly-ai-review.json
            .curator/weekly-ai-review.md
          if-no-files-found: warn
          retention-days: 30
