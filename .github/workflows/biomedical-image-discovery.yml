name: Weekly biomedical image paper discovery

on:
  # Run automatically once a week. GitHub schedules use UTC.
  schedule:
    - cron: "17 13 * * 1"

  # Also allow a maintainer to run and demonstrate the workflow on demand.
  workflow_dispatch:
    inputs:
      source:
        description: Discovery source
        required: true
        default: pubmed
        type: choice
        options:
          - pubmed
          - openalex
          - all
      max_results:
        description: Maximum results per database query
        required: true
        default: "100"
        type: choice
        options:
          - "50"
          - "100"

# The MVP can read the repository but cannot change it.
permissions:
  contents: read

concurrency:
  group: biomedical-image-discovery
  cancel-in-progress: false

jobs:
  discover:
    # Fork-only safety guard. If this file is copied upstream, the job is skipped.
    if: github.repository == 'zaiyouzy/AwesomeBiomedicalAI'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test the curator helper
        run: >-
          python -m unittest discover
          -s .agents/skills/biomedical-image-curator/tests
          -p "test_*.py"
          -v

      - name: Discover candidate papers
        env:
          DISCOVERY_SOURCE: ${{ inputs.source || 'pubmed' }}
          MAX_RESULTS: ${{ inputs.max_results || '100' }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          mkdir -p .curator
          python .agents/skills/biomedical-image-curator/scripts/curator.py \
            --repo . \
            discover \
            --year 2026 \
            --source "$DISCOVERY_SOURCE" \
            --max "$MAX_RESULTS" \
            --output .curator/weekly-discovery.json

      - name: Show the candidate report in the run summary
        if: success()
        env:
          DISCOVERY_SOURCE: ${{ inputs.source || 'pubmed' }}
        run: |
          echo "## Biomedical Images — Other" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Discovery source:** $DISCOVERY_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat .curator/weekly-discovery.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomedical-image-candidates-${{ github.run_number }}
          path: |
            .curator/weekly-discovery.json
            .curator/weekly-discovery.md
          if-no-files-found: warn
          retention-days: 30
